<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  #stage { position: fixed; inset: 0; }

    position: fixed; left: 18px; bottom: 14px; z-index: 2;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;

  #forms {
    position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 2;

    letter-spacing: 0.06em; user-select: none; display: flex; gap: 2px;
  }
  #forms button {
    all: unset; cursor: pointer; padding: 4px 10px;
    color: rgba(235, 238, 245, 0.38);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #forms button:hover { color: rgba(235, 238, 245, 0.8); }
  #forms button.on { color: rgba(235, 238, 245, 0.92); border-bottom: 1px solid rgba(235,238,245,0.5); }
