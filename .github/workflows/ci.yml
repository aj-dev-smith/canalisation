name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build + invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: the simulation and its tests have zero dependencies.
      # playwright is a devDependency used only by the optional tools/ scripts.

      - name: Build
        run: node build.js

      - name: canalisation.html is in sync with src/
        run: |
          if ! git diff --exit-code --stat canalisation.html; then
            echo
            echo "::error file=canalisation.html::Build artifact is stale."
            echo "canalisation.html does not match what build.js produces from src/."
            echo "Run 'node build.js' and commit the result alongside your source change."
            exit 1
          fi

      - name: Invariants
        run: node test/smoke.mjs

      # The second gate. `smoke.mjs` imports `50_geom.js` and checks that a
      # senescing blade is drawn differently from a live one; this checks the
      # things that would be silently wrong EVERYWHERE at once — the ribbon
      # emitter every vein and needle goes through, and the cell table that
      # stands in for the live per-cell solve on a mature leaf. A green gate is a
      # statement about what the gate imports, and this widens what it imports.
      #
      # Naming a species skips the garden of eight, which is 34s of the harness's
      # 39s and is why gating the whole thing here took this job from 123s to 335s.
      - name: Render views
        run: node test/views.mjs 'Cathedral Fern'

  # THE HEAVIEST CONFIGURATION THE SCENE CAN REACH, and the only one that can prove
  # a buffer is not silently dropping geometry — the three buffer sizes in
  # `50_geom.js` are set from exactly this measurement. A full buffer is a picture
  # that is merely missing things, so this GATES and is not a diagnostic.
  #
  # ITS OWN JOB, so it runs concurrently with the invariants rather than inside
  # them. That is worth 165s of wall clock: as a step on one matrix entry it took
  # that job from 105s to 269s, and as a step on both it took it to 335s. Nothing
  # here needs the build, so there is no reason for it to wait.
  #
  # **THE JOB NAME BELOW IS A REQUIRED STATUS CONTEXT on `main`.** Renaming it
  # silently stops it gating — GitHub matches required checks by name, and a
  # required context that never reports blocks every PR instead. If you rename it,
  # update branch protection in the same change:
  #
  #   gh api repos/OWNER/REPO/branches/main/protection/required_status_checks/contexts
  #
  # This is the mistake that was made once already, in the other direction: it was
  # briefly a job while only `build + invariants` was required, so it ran, went red
  # and let the merge through. A check that is not a required context is not a gate.
  views-garden:
    name: render views (a garden of eight)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No build step: this reads `src/` directly, like every harness in `test/`.
      - name: Every view, a stand of eight
        run: node test/views.mjs

  diagnostics:
    name: diagnostics (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # These harnesses print numbers and always exit 0 — they never gate a merge.
      # They run so the measurements land in the PR's logs, where a reviewer can
      # diff them against the same output on main.
      - name: Phyllotaxis
        run: node test/phyllo.mjs
      - name: Patterning
        run: node test/pattern.mjs '{"T":40,"D":6}' '{"G":0}'
      - name: Leaf margin
        run: node test/margin.mjs
      - name: Fruit
        run: node test/fruit.mjs
      # The sweep in this one CAN fail — it asserts that the falling-plate model
      # actually selects a regime. It also runs inside smoke.mjs, which does gate;
      # it is here so the numbers land in the PR log next to the others.
      - name: Falling blade
        run: node test/fall.mjs sweep
